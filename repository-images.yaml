images:
  - name: openapi-mcp
    group: mcp-server
    catalog: false
    dockerfile: mcp-servers/Dockerfile.openapi-mcp
    paths:
      - openapi-mcp/config.py
      - openapi-mcp/network.py
      - openapi-mcp/server.py
      - openapi-mcp/pyproject.toml
      - openapi-mcp/uv.lock
      - openapi-mcp/test_config.py
      - openapi-mcp/test_network.py
      - openapi-mcp/test_server.py
      - openapi-mcp/fixtures/api.json
      - openapi-mcp/README.md
    parents:
      - arg: PYTHON_IMAGE
        image: python:3.12-slim-bookworm

  - name: github
    group: mcp-server
    catalog: true
    version: "1.11.0"
    dockerfile: mcp-servers/Dockerfile.github
    parents:
      - arg: GITHUB_IMAGE
        image: ghcr.io/github/github-mcp-server:v1.11.0

  - name: tableau
    group: mcp-server
    catalog: true
    version: "4.8.1"
    dockerfile: mcp-servers/Dockerfile.tableau
    parents:
      - arg: NODE_IMAGE
        image: node:22-alpine

  - name: http-webhook-mcp-converter
    group: mcp-server
    dockerfile: mcp-servers/Dockerfile.http-webhook-mcp-converter
    paths:
      - http-webhook-mcp-converter/package.json
      - http-webhook-mcp-converter/package-lock.json
      - http-webhook-mcp-converter/server.js
    parents:
      - arg: NODE_IMAGE
        image: node:24-alpine

  - name: stdio-wrapper
    group: stdio-wrapper
    dockerfile: Dockerfile.stdio-wrapper
