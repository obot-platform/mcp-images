name: Build and Push MCP Images

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-repository-mcp-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  generate-matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.value }}
    steps:
      - name: Require main for manual publication
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual publication is allowed only from the main branch" >&2
          exit 1
      - uses: actions/checkout@v4
      - name: Read MCP server images
        id: images
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          images=$(yq eval -o=json '[.images[] | select(.group == "mcp-server") | del(.group)]' repository-images.yaml | jq -c .)
          # Repository release tags apply only to images with an application
          # version. Unversioned images remain in branch-based lineages.
          if [ "$REF_TYPE" = "tag" ]; then
            images=$(jq -c '[.[] | select(.version != null)]' <<<"$images")
          fi
          echo "value=$images" >> "$GITHUB_OUTPUT"

  publish:
    needs: generate-matrix
    uses: ./.github/workflows/repository-images.yml
    with:
      images_json: ${{ needs.generate-matrix.outputs.images }}
    secrets: inherit
