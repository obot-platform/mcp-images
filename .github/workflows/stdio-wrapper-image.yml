name: Build and Push STDIO Wrapper Image

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - Dockerfile.stdio-wrapper
jobs:
  docker-build:
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image-identifier:
          - stdio-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: .
          push: true
          pull: true
          file: Dockerfile.${{ matrix.image-identifier }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_REPO }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.5"
      - name: Check install!
        run: cosign version
      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: |
            ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_REPO }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4
      - name: Copy image to latest tag
        if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc') }}
        run: |
          crane tag ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_REPO }}/${{ matrix.image-identifier }}:${{ github.ref_name }} latest

  trivy-scan:
    permissions:
      contents: read
      packages: read
      security-events: write
    needs: docker-build
    strategy:
      fail-fast: false
      matrix:
        image-identifier:
          - stdio-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}
      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_REPO }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
          skip-dirs: "**/venv"
          format: "sarif"
          output: "trivy-results-${{ matrix.image-identifier }}.sarif"
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.image-identifier }}.sarif
          category: trivy-${{ matrix.image-identifier }}
