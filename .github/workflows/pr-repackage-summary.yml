name: Comment Repackaged Image Preview

# The Build workflow runs untrusted pull-request code with a read-only token.
# This separate default-branch workflow receives only its Markdown artifact, so
# fork PRs can get a comment without exposing a write token to their code.
on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: repackage-plan-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - name: Find matching pull request
        id: pr
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const run = context.payload.workflow_run;
            const headOwner = run.head_repository?.owner?.login;
            if (!headOwner || !run.head_branch || !run.head_sha) {
              core.notice("Workflow run has no usable head repository metadata");
              return "";
            }

            // workflow_run.pull_requests is empty for some fork runs. Resolve
            // through the base repository, then verify all untrusted selectors
            // against workflow-run metadata before using the PR number.
            const {data: pulls} = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "main",
              head: `${headOwner}:${run.head_branch}`,
              per_page: 100,
            });
            const matches = pulls.filter(pull =>
              pull.head.sha === run.head_sha &&
              pull.head.repo?.full_name === run.head_repository.full_name
            );
            if (matches.length !== 1) {
              core.notice(`Expected one matching pull request, found ${matches.length}`);
              return "";
            }
            return String(matches[0].number);

      - name: Download revision preview
        if: steps.pr.outputs.result != ''
        uses: actions/download-artifact@v4
        with:
          name: repackage-plan
          # Keep untrusted artifact contents out of the workflow workspace.
          path: ${{ runner.temp }}/repackage-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create or update PR comment
        if: steps.pr.outputs.result != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.result }}
          REPORT_PATH: ${{ runner.temp }}/repackage-plan/repackage-plan.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- repackage-plan -->";
            // Suppress mentions because this report originates from untrusted PR data.
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8")
              .replaceAll("@", "@\u200b");
            const body = `${marker}\n${report}`;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user.type === "Bot" && comment.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
