name: Build and Push Base Images

on:
  workflow_call:
    inputs:
      image_identifiers:
        # The publisher passes only language families whose Dockerfiles changed.
        description: JSON array of base image identifiers to publish
        required: false
        type: string
        default: '["base-python","base-node"]'
jobs:
  docker-build:
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image-identifier: ${{ fromJson(inputs.image_identifiers || '["base-python","base-node"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure Python parent image
        if: matrix.image-identifier == 'base-python'
        id: parents
        run: |
          uv_image=$(cat UV_IMAGE)
          echo "build-args=UV_IMAGE=${uv_image}" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: .
          push: true
          pull: true
          file: Dockerfile.${{ matrix.image-identifier }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.parents.outputs.build-args }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.5"
      - name: Check install!
        run: cosign version
      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  trivy-scan:
    permissions:
      contents: read
      packages: read
      security-events: write
    needs: docker-build
    uses: ./.github/workflows/scan-base-images.yml
    with:
      image_identifiers: ${{ inputs.image_identifiers }}
