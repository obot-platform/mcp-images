name: Build and Push Base Images

on:
  workflow_call:
    inputs:
      image_identifiers:
        # The publisher passes only language families whose Dockerfiles changed.
        description: JSON array of base image identifiers to publish
        required: false
        type: string
        default: '["base-python","base-node"]'
jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image-identifier: ${{ fromJson(inputs.image_identifiers || '["base-python","base-node"]') }}
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Configure Python parent image
        if: matrix.image-identifier == 'base-python'
        id: parents
        run: |
          uv_image=$(cat UV_IMAGE)
          echo "build-args=UV_IMAGE=${uv_image}" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image by digest
        uses: docker/build-push-action@v7
        id: build-and-push
        with:
          context: .
          pull: true
          file: Dockerfile.${{ matrix.image-identifier }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ steps.parents.outputs.build-args }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          ARCH: ${{ matrix.platform.arch }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/$ARCH"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH/image"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: base-digests-${{ matrix.image-identifier }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image-identifier: ${{ fromJson(inputs.image_identifiers || '["base-python","base-node"]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: imjasonh/setup-crane@v0.7

      - name: Download AMD64 image digest
        uses: actions/download-artifact@v4
        with:
          name: base-digests-${{ matrix.image-identifier }}-amd64
          path: ${{ runner.temp }}/digests

      - name: Download ARM64 image digest
        uses: actions/download-artifact@v4
        with:
          name: base-digests-${{ matrix.image-identifier }}-arm64
          path: ${{ runner.temp }}/digests

      - name: Publish image manifest
        id: published
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}
          TAG: ${{ github.ref_name }}
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/amd64/image")
          arm64=$(cat "$RUNNER_TEMP/digests/arm64/image")
          docker buildx imagetools create --tag "$REPOSITORY:$TAG" \
            "$REPOSITORY@$amd64" "$REPOSITORY@$arm64"
          digest=$(crane digest "$REPOSITORY:$TAG")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.5"
      - name: Check install!
        run: cosign version
      - name: Sign Images
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  trivy-scan:
    permissions:
      contents: read
      packages: read
      security-events: write
    needs: publish
    uses: ./.github/workflows/scan-base-images.yml
    with:
      image_identifiers: ${{ inputs.image_identifiers }}
