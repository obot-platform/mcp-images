name: Build and Push Base Images

on:
  workflow_call:
    inputs:
      image_identifiers:
        # The publisher passes only language families whose Dockerfiles changed.
        description: JSON array of base image identifiers to publish
        required: false
        type: string
        default: '["base-python","base-node"]'
jobs:
  docker-build:
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image-identifier: ${{ fromJson(inputs.image_identifiers || '["base-python","base-node"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4
      - name: Resolve Wolfi base image
        id: wolfi
        run: |
          # Pin the mutable upstream tag so every downstream fingerprint names
          # the exact parent manifest used by this build.
          digest=$(crane digest cgr.dev/chainguard/wolfi-base:latest)
          echo "image=cgr.dev/chainguard/wolfi-base:latest@${digest}" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: .
          push: true
          pull: true
          file: Dockerfile.${{ matrix.image-identifier }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ steps.wolfi.outputs.image }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.5"
      - name: Check install!
        run: cosign version
      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Copy image to latest tag
        if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc') }}
        run: |
          crane tag ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}:${{ github.ref_name }} latest

  trivy-scan:
    permissions:
      contents: read
      packages: read
      security-events: write
    needs: docker-build
    strategy:
      fail-fast: false
      matrix:
        image-identifier: ${{ fromJson(inputs.image_identifiers || '["base-python","base-node"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
          skip-dirs: "**/venv"
          format: "sarif"
          output: "trivy-results-${{ matrix.image-identifier }}.sarif"
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.image-identifier }}.sarif
