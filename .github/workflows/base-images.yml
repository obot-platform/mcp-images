name: Build and Push Base Images

on:
  workflow_call:
    inputs:
      image_identifiers:
        # The publisher passes only language families whose Dockerfiles changed.
        description: JSON array of base image identifiers to publish
        required: false
        type: string
        default: '["base-python","base-node"]'
jobs:
  docker-build:
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image-identifier: ${{ fromJson(inputs.image_identifiers || '["base-python","base-node"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4
      - name: Resolve parent images
        id: parents
        env:
          IMAGE_IDENTIFIER: ${{ matrix.image-identifier }}
        run: |
          # The exact parent manifests become build arguments so a mutable
          # upstream tag cannot change between resolution and the build.
          wolfi_digest=$(crane digest cgr.dev/chainguard/wolfi-base:latest)
          {
            echo "build-args<<EOF"
            echo "BASE_IMAGE=cgr.dev/chainguard/wolfi-base:latest@${wolfi_digest}"
            if [ "$IMAGE_IDENTIFIER" = "base-python" ]; then
              uv_digest=$(crane digest ghcr.io/astral-sh/uv:0.12.5)
              echo "UV_IMAGE=ghcr.io/astral-sh/uv:0.12.5@${uv_digest}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: .
          push: true
          pull: true
          file: Dockerfile.${{ matrix.image-identifier }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.parents.outputs.build-args }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.5"
      - name: Check install!
        run: cosign version
      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image-identifier }}:${{ github.ref_name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  trivy-scan:
    permissions:
      contents: read
      packages: read
      security-events: write
    needs: docker-build
    uses: ./.github/workflows/scan-base-images.yml
    with:
      image_identifiers: ${{ inputs.image_identifiers }}
