name: Publish MCP Images

on:
  workflow_dispatch:
    inputs:
      rebuild_base_images:
        description: Rebuild both shared base images before evaluating applications
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - .github/workflows/base-images.yml
      - .github/workflows/publish-image.yml
      - .github/workflows/publish-images.yml
      - .github/workflows/scan-base-images.yml
      - .dockerignore
      - .trivyignore
      - trivy-secret.yaml
      - Dockerfile.base-node
      - Dockerfile.base-python
      - Dockerfile.stdio-wrapper
      - http-webhook-mcp-converter/**
      - mcp-servers/**
      - repackaging/**
      - repository-images.yaml
      - scripts/image_plan.py
      - scripts/mmmcp.sh

concurrency:
  group: publish-mcp-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base_images: ${{ steps.detect.outputs.base_images }}
      base_rescans: ${{ steps.detect.outputs.base_rescans }}
      repackages: ${{ steps.detect.outputs.repackages }}
      repository: ${{ steps.detect.outputs.repository }}
      utilities: ${{ steps.detect.outputs.utilities }}
    steps:
      - name: Require main for manual publication
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual publication is allowed only from the main branch" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected image families
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REBUILD_BASE_IMAGES: ${{ inputs.rebuild_base_images }}
        run: |
          images='[]'
          rescans='[]'
          repackages=false
          repository=false
          utilities=false

          if [ "$REBUILD_BASE_IMAGES" = "true" ]; then
            images='["base-node","base-python"]'
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            utilities=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            repackages=true
            repository=true
            utilities=true
          else
            changed=$(git diff --name-only "$BEFORE_SHA" "${{ github.sha }}")

            if grep -qx '.github/workflows/base-images.yml' <<<"$changed" || \
               grep -qx '.dockerignore' <<<"$changed"; then
              images='["base-node","base-python"]'
            else
              if grep -qx 'Dockerfile.base-node' <<<"$changed"; then
                images=$(jq -c '. + ["base-node"]' <<<"$images")
              fi
              if grep -qx 'Dockerfile.base-python' <<<"$changed"; then
                images=$(jq -c '. + ["base-python"]' <<<"$images")
              fi
            fi

            if grep -Eq '^(\.github/workflows/scan-base-images\.yml|\.trivyignore|trivy-secret\.yaml)$' <<<"$changed"; then
              rescans='["base-node","base-python"]'
            fi

            if grep -Eq '^(\.github/workflows/(base-images|publish-image|publish-images)\.yml|\.dockerignore|\.trivyignore|trivy-secret\.yaml|Dockerfile\.base-(node|python)|repackaging/|scripts/(image_plan\.py|mmmcp\.sh))' <<<"$changed"; then
              repackages=true
            fi
            # Evaluate the whole affected family. The planner's fingerprints make
            # unchanged entries cheap no-ops and avoid per-image diff rules here.
            if grep -Eq '^(\.github/workflows/(publish-image|publish-images)\.yml|\.dockerignore|\.trivyignore|trivy-secret\.yaml|mcp-servers/|repository-images\.yaml|scripts/image_plan\.py)' <<<"$changed"; then
              repository=true
            fi
            if grep -Eq '^(\.github/workflows/(publish-image|publish-images)\.yml|\.dockerignore|\.trivyignore|trivy-secret\.yaml|Dockerfile\.stdio-wrapper|mcp-servers/|http-webhook-mcp-converter/|repository-images\.yaml|scripts/image_plan\.py)' <<<"$changed"; then
              utilities=true
            fi
          fi

          images=$(jq -c 'unique' <<<"$images")
          rescans=$(jq -cn --argjson scans "$rescans" --argjson builds "$images" '$scans - $builds | unique')
          echo "base_images=$images" >> "$GITHUB_OUTPUT"
          echo "base_rescans=$rescans" >> "$GITHUB_OUTPUT"
          echo "repackages=$repackages" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "utilities=$utilities" >> "$GITHUB_OUTPUT"

  base-images:
    needs: changes
    if: needs.changes.outputs.base_images != '[]'
    uses: ./.github/workflows/base-images.yml
    with:
      image_identifiers: ${{ needs.changes.outputs.base_images }}
    secrets: inherit

  base-image-rescans:
    needs: changes
    if: needs.changes.outputs.base_rescans != '[]'
    uses: ./.github/workflows/scan-base-images.yml
    with:
      image_identifiers: ${{ needs.changes.outputs.base_rescans }}

  repackages:
    needs: [changes, base-images]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.repackages == 'true' && (needs.base-images.result == 'success' || needs.base-images.result == 'skipped')
    uses: ./.github/workflows/publish-image.yml
    with:
      family: repackage
    secrets: inherit

  repository-images:
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    uses: ./.github/workflows/publish-image.yml
    with:
      family: repository
    secrets: inherit

  utilities:
    needs: changes
    if: needs.changes.outputs.utilities == 'true'
    uses: ./.github/workflows/publish-image.yml
    with:
      family: utility
    secrets: inherit
