name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test image planner
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfiles
        run: |
          for dockerfile in Dockerfile.* mcp-servers/Dockerfile.* repackaging/Dockerfile.*; do
            docker buildx build --check --file "$dockerfile" .
          done
  repackage-plan:
    # Preview uses the same live registry resolver as publishing but never pushes.
    # Reviewers can therefore see which immutable tags a merge would allocate.
    name: Preview immutable image revisions
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4

      - name: Preview revisions
        env:
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          repackages=$(yq eval -o=json '.images' repackaging/images.yaml | jq -c '[.[] | {family: "repackage", image: .}]')
          repository=$(yq eval -o=json '.images' repository-images.yaml | jq -c '[.[] | select(.version != null) | {family: "repository", image: del(.group)}]')
          utilities=$(yq eval -o=json '.images' repository-images.yaml | jq -c '[.[] | select(.version == null) | {family: "utility", image: del(.group)}]')
          entries=$(jq -cn --argjson repackages "$repackages" --argjson repository "$repository" --argjson utilities "$utilities" '$repackages + $repository + $utilities')
          duplicates=$(jq -r 'group_by(.image.name)[] | select(length > 1) | .[0].image.name' <<<"$entries")
          if [ -n "$duplicates" ]; then
            echo "Duplicate image names:" >&2
            echo "$duplicates" >&2
            exit 1
          fi
          report=repackage-plan.md
          python3 scripts/image_plan.py preview \
            --entries-json "$entries" \
            --registry-prefix "$REGISTRY_PREFIX" \
            --source-revision "${{ github.sha }}" > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload revision preview
        uses: actions/upload-artifact@v4
        with:
          name: repackage-plan
          path: repackage-plan.md
          retention-days: 1
