name: Publish Repository Images

on:
  workflow_call:
    inputs:
      images_json:
        description: JSON array describing repository-owned images and their inputs
        required: true
        type: string

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.images_json) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image revision
        id: image
        env:
          IMAGE_JSON: ${{ toJson(matrix) }}
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Each image declares its own repository paths and remote parents, so
          # unrelated source changes reuse their existing immutable revisions.
          plan=$(python3 scripts/repository_image.py \
            --image-json "$IMAGE_JSON" \
            --version "$VERSION" \
            --registry-prefix "$REGISTRY_PREFIX")
          echo "build=$(jq -r '.build' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r '.revision' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "repository=$(jq -r '.repository' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(jq -r '.fingerprint' <<<"$plan")" >> "$GITHUB_OUTPUT"
          {
            echo "build-args<<EOF"
            jq -r '.build_args | to_entries[] | "\(.key)=\(.value)"' <<<"$plan"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          jq . <<<"$plan"

      - name: Refuse an existing revision tag
        if: steps.image.outputs.build == 'true'
        run: |
          # Serialized callers are the primary guard. This catches a stale or
          # manually-created target that already exists before publication.
          if crane manifest "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}" >/dev/null 2>&1; then
            echo "Immutable tag already exists: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}" >&2
            exit 1
          fi

      - name: Build and push immutable image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.image.outputs.build-args }}
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.obot.mcp.input-fingerprint=${{ steps.image.outputs.fingerprint }}
            io.obot.mcp.application.version=${{ github.ref_name }}
            io.obot.mcp.image.revision=${{ steps.image.outputs.revision }}

      - name: Update branch alias
        if: github.ref_type == 'branch'
        run: |
          crane tag "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}" "${{ github.ref_name }}"

      - name: Update latest release alias
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-rc')
        run: |
          crane tag "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}" latest

      - name: Read published digest
        id: published
        run: |
          # Reused images still complete post-publication work on workflow retries.
          digest=$(crane digest "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.5"

      - name: Sign image
        run: |
          cosign sign --yes "${{ steps.image.outputs.repository }}@${{ steps.published.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          artifact-name: sbom-${{ matrix.name }}-${{ steps.image.outputs.tag }}.spdx.json
          dependency-snapshot: false
          upload-artifact-retention: 30

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          skip-dirs: "**/venv"
          format: "sarif"
          output: trivy-results-${{ matrix.name }}-${{ steps.image.outputs.tag }}.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          category: trivy-${{ matrix.name }}-${{ steps.image.outputs.tag }}
          sarif_file: trivy-results-${{ matrix.name }}-${{ steps.image.outputs.tag }}.sarif

      - name: Trigger catalog update
        # Catalog consumers move from latest to the immutable release revision.
        # Reruns recover a dispatch missed after an otherwise successful publish.
        if: matrix.catalog == true && github.ref_type == 'tag' && !contains(github.ref_name, '-rc') && (steps.image.outputs.build == 'true' || github.run_attempt > 1)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: obot-platform/mcp-catalog
          event-type: update-image-tag
          client-payload: |
            {
              "image_name": "${{ steps.image.outputs.repository }}",
              "new_tag": "${{ steps.image.outputs.tag }}"
            }
