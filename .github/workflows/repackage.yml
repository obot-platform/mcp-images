name: Repackage MCP Images

# Called only by publish-repackages.yml so base publication, revision allocation,
# and final publication share one serialized workflow execution.
on:
  workflow_call:

jobs:
  generate-matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate matrix from images.yaml
        id: set-matrix
        run: |
          # The full matrix is intentional: registry fingerprints, rather than a
          # fragile Git diff, decide which entries actually need to build.
          matrix=$(yq eval -o=json '[.images[] | select(.type != null) | pick(["name", "type", "package", "version", "constraints", "overrides"])]' repackaging/images.yaml | jq -c .)
          duplicates=$(jq -r 'group_by(.name)[] | select(length > 1) | .[0].name' <<<"$matrix")
          if [ -n "$duplicates" ]; then
            echo "Duplicate image names:" >&2
            echo "$duplicates" >&2
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  repackage:
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image revision
        id: image
        env:
          IMAGE_JSON: ${{ toJson(matrix) }}
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          # The plan resolves parent digests first, hashes all effective inputs,
          # then either reuses the latest matching revision or allocates N+1.
          plan=$(python3 scripts/repackage_image.py \
            --image-json "$IMAGE_JSON" \
            --registry-prefix "$REGISTRY_PREFIX")
          echo "build=$(jq -r '.build' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r '.revision' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "repository=$(jq -r '.repository' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(jq -r '.fingerprint' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "base-image=$(jq -r '.base_image // empty' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "wrapper-image=$(jq -r '.wrapper_image // empty' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "source-image=$(jq -r '.source_image // empty' <<<"$plan")" >> "$GITHUB_OUTPUT"
          jq . <<<"$plan"

      - name: Refuse immutable tag races
        if: steps.image.outputs.build == 'true'
        run: |
          # Concurrency is the primary guard; this last-moment check makes an
          # unexpected external publisher fail closed instead of overwriting.
          if crane manifest "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}" >/dev/null 2>&1; then
            echo "Immutable tag already exists: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}" >&2
            exit 1
          fi

      - name: Update moving main alias
        if: steps.image.outputs.build == 'false'
        run: |
          # Immutable artifacts are reused, but the intentionally mutable preview
          # alias should always follow the manifest's currently selected revision.
          crane tag "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}" "${{ matrix.version }}-main"

      - name: Check application base image
        if: (matrix.type == 'node' || matrix.type == 'python') && steps.image.outputs.build == 'true'
        id: application-base
        env:
          REFERENCE: ${{ steps.image.outputs.repository }}-base:${{ steps.image.outputs.tag }}
          EXPECTED_FINGERPRINT: ${{ steps.image.outputs.fingerprint }}
          EXPECTED_VERSION: ${{ matrix.version }}
          EXPECTED_REVISION: ${{ steps.image.outputs.revision }}
        run: |
          # A failed run may have pushed this intermediate before the final image.
          # Reuse it only when all immutable identity labels match; never overwrite it.
          if crane manifest "$REFERENCE" >/dev/null 2>&1; then
            config=$(crane config --platform linux/amd64 "$REFERENCE")
            actual_fingerprint=$(jq -r '.config.Labels["io.obot.mcp.input-fingerprint"] // empty' <<<"$config")
            actual_version=$(jq -r '.config.Labels["io.obot.mcp.application.version"] // empty' <<<"$config")
            actual_revision=$(jq -r '.config.Labels["io.obot.mcp.image.revision"] // empty' <<<"$config")
            if [ "$actual_fingerprint" != "$EXPECTED_FINGERPRINT" ] || \
               [ "$actual_version" != "$EXPECTED_VERSION" ] || \
               [ "$actual_revision" != "$EXPECTED_REVISION" ]; then
              echo "Existing application base has unexpected immutable metadata: $REFERENCE" >&2
              exit 1
            fi
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Python application base
        if: matrix.type == 'python' && steps.image.outputs.build == 'true' && steps.application-base.outputs.build == 'true'
        uses: docker/build-push-action@v6
        id: build-python-base
        with:
          context: .
          push: true
          pull: true
          file: repackaging/Dockerfile.mcp-python
          platforms: linux/amd64,linux/arm64
          build-args: |
            MCP_PACKAGE=${{ matrix.package }}
            MCP_VERSION=${{ matrix.version }}
            BASE_IMAGE=${{ steps.image.outputs.base-image }}
            MCP_CONSTRAINTS=${{ join(matrix.constraints, ' ') }}
            MCP_OVERRIDES=${{ join(matrix.overrides, ' ') }}
          tags: |
            ${{ steps.image.outputs.repository }}-base:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.obot.mcp.input-fingerprint=${{ steps.image.outputs.fingerprint }}
            io.obot.mcp.application.version=${{ matrix.version }}
            io.obot.mcp.image.revision=${{ steps.image.outputs.revision }}

      - name: Build and push Node application base
        if: matrix.type == 'node' && steps.image.outputs.build == 'true' && steps.application-base.outputs.build == 'true'
        uses: docker/build-push-action@v6
        id: build-node-base
        with:
          context: .
          push: true
          pull: true
          file: repackaging/Dockerfile.mcp-node
          platforms: linux/amd64,linux/arm64
          build-args: |
            MCP_PACKAGE=${{ matrix.package }}
            MCP_VERSION=${{ matrix.version }}
            BASE_IMAGE=${{ steps.image.outputs.base-image }}
          tags: |
            ${{ steps.image.outputs.repository }}-base:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.obot.mcp.input-fingerprint=${{ steps.image.outputs.fingerprint }}
            io.obot.mcp.application.version=${{ matrix.version }}
            io.obot.mcp.image.revision=${{ steps.image.outputs.revision }}

      - name: Read application base digest
        if: (matrix.type == 'node' || matrix.type == 'python') && steps.image.outputs.build == 'true'
        id: base
        run: |
          digest=$(crane digest "${{ steps.image.outputs.repository }}-base:${{ steps.image.outputs.tag }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build final image
        if: (matrix.type == 'node' || matrix.type == 'python') && steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        id: build-final
        with:
          context: .
          push: true
          pull: true
          file: Dockerfile.mmmcp
          platforms: linux/amd64,linux/arm64
          # Both intermediate parents are digest-pinned by the resolver/build,
          # ensuring the artifact matches the inputs represented by its label.
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.repository }}-base@${{ steps.base.outputs.digest }}
            MMMCP_IMAGE=${{ steps.image.outputs.wrapper-image }}
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repository }}:${{ matrix.version }}-main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.obot.mcp.input-fingerprint=${{ steps.image.outputs.fingerprint }}
            io.obot.mcp.application.version=${{ matrix.version }}
            io.obot.mcp.image.revision=${{ steps.image.outputs.revision }}

      - name: Build tagged upstream Docker image
        if: matrix.type == 'docker' && steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        id: build-docker
        with:
          # Rebuilding the upstream image as a no-op FROM layer lets us attach the
          # same provenance labels used for Node/Python instead of merely retagging.
          context: .
          push: true
          pull: true
          file: repackaging/Dockerfile.mcp-docker
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.source-image }}
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repository }}:${{ matrix.version }}-main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.obot.mcp.input-fingerprint=${{ steps.image.outputs.fingerprint }}
            io.obot.mcp.application.version=${{ matrix.version }}
            io.obot.mcp.image.revision=${{ steps.image.outputs.revision }}

      - name: Read published digest
        id: published
        run: |
          # Post-publication work also runs for reused images so a retry can
          # finish signing or SBOM generation after a partial previous run.
          digest=$(crane digest "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.5"

      - name: Sign image
        run: |
          cosign sign --yes "${{ steps.image.outputs.repository }}@${{ steps.published.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          artifact-name: sbom-${{ matrix.name }}-${{ steps.image.outputs.tag }}.spdx.json
          dependency-snapshot: false
          upload-artifact-retention: 30

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          skip-dirs: "**/venv"
          format: "sarif"
          output: trivy-results-${{ matrix.name }}-${{ steps.image.outputs.tag }}.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          category: trivy-${{ matrix.name }}-${{ steps.image.outputs.tag }}
          sarif_file: trivy-results-${{ matrix.name }}-${{ steps.image.outputs.tag }}.sarif
