name: Repackage MCP Images

on:
  workflow_call:
    inputs:
      force-rebuild:
        description: Rebuild images even when their versioned tag already exists
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force-rebuild:
        description: Rebuild images even when their versioned tag already exists
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - .github/workflows/repackage.yml
      - .trivyignore
      - trivy-secret.yaml
      - Dockerfile.base-python
      - Dockerfile.base-node
      - Dockerfile.mmmcp
      - scripts/mmmcp.sh
      - repackaging/**

jobs:
  generate-matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate matrix from images.yaml
        id: set-matrix
        run: |
          matrix=$(yq eval -o=json '.images[] | select(.type != null) |= pick(["name", "type", "package", "version", "constraints", "overrides"])' repackaging/images.yaml | jq -cs .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  repackage:
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check-image
        run: |
          if [ "${{ inputs.force-rebuild }}" = "true" ] || [ "${{ vars.FORCE_REBUILD }}" = "true" ]; then
            echo "Forcing rebuild of image"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IMAGE_TAG="ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.version }}"
          if docker manifest inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_TAG already exists, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_TAG does not exist, will build"
          fi

      - name: Build and push python-based base image
        if: ${{ matrix.type == 'python' && steps.check-image.outputs.exists == 'false' }}
        uses: docker/build-push-action@v6
        id: build-python-base
        with:
          context: .
          push: true
          pull: true
          file: repackaging/Dockerfile.mcp-python
          platforms: linux/amd64,linux/arm64
          build-args: |
            MCP_PACKAGE=${{ matrix.package }}
            MCP_VERSION=${{ matrix.version }}
            BASE_TAG=main
            MCP_CONSTRAINTS=${{ join(matrix.constraints, ' ') }}
            MCP_OVERRIDES=${{ join(matrix.overrides, ' ') }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}-base:${{ matrix.version }}

      - name: Build and push node-based base image
        if: ${{ matrix.type == 'node' && steps.check-image.outputs.exists == 'false' }}
        uses: docker/build-push-action@v6
        id: build-node-base
        with:
          context: .
          push: true
          pull: true
          file: repackaging/Dockerfile.mcp-node
          platforms: linux/amd64,linux/arm64
          build-args: |
            MCP_PACKAGE=${{ matrix.package }}
            MCP_VERSION=${{ matrix.version }}
            BASE_TAG=main
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}-base:${{ matrix.version }}

      - name: Build final image
        if: ${{ matrix.type == 'node' || matrix.type == 'python' }}
        uses: docker/build-push-action@v6
        id: build-final
        with:
          context: .
          push: true
          pull: true
          file: Dockerfile.mmmcp
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}/${{ matrix.name }}-base:${{ matrix.version }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.version }}

      - name: Setup crane
        if: ${{ matrix.type == 'docker' }}
        uses: imjasonh/setup-crane@v0.4

      - name: Retag existing docker image
        if: ${{ matrix.type == 'docker' && steps.check-image.outputs.exists == 'false' }}
        run: |
          crane copy ${{ matrix.package }}:${{ matrix.version }} ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.version }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: "v3.0.5"

      - name: Sign image
        if: ${{ matrix.type == 'node' && steps.check-image.outputs.exists == 'false' }}
        env:
          DIGEST: ${{ steps.build-final.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.version }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        if: steps.check-image.outputs.exists == 'true'
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.version }}
          artifact-name: sbom-${{ matrix.name }}-${{ matrix.version }}.spdx.json
          dependency-snapshot: false
          upload-artifact-retention: 30

      - name: trigger catalog update
        if: steps.check-image.outputs.exists == 'false'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: obot-platform/mcp-catalog
          event-type: update-image-tag
          client-payload: |
            {
              "image_name": "ghcr.io/${{ github.repository }}/${{ matrix.name }}",
              "new_tag": "${{ matrix.version }}",
              "name": "${{ matrix.name }}",
              "package": "${{ matrix.package }}",
              "type": "${{ matrix.type }}"
            }

  trivy-scan:
    permissions:
      contents: read
      packages: read
      security-events: write
    needs: [generate-matrix, repackage]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.version }}
          skip-dirs: "**/venv"
          format: "sarif"
          output: "trivy-results-${{ matrix.name }}-${{ matrix.version }}.sarif"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          category: trivy-${{ matrix.name }}
          sarif_file: trivy-results-${{ matrix.name }}-${{ matrix.version }}.sarif
