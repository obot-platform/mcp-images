images:
  - name: aws-api
    type: python
    package: awslabs.aws-api-mcp-server
    version: 1.5.1
  - name: aws-documentation
    type: python
    package: awslabs.aws-documentation-mcp-server
    version: 1.1.30
  - name: aws-eks
    type: python
    package: awslabs.eks-mcp-server
    version: 0.1.37
  - name: aws-kendra
    type: python
    package: awslabs.amazon-kendra-index-mcp-server
    version: 1.0.21
  - name: aws-redshift
    type: python
    package: awslabs.redshift-mcp-server
    version: 0.0.34
  - name: azure
    type: node
    package: "@azure/mcp"
    version: 2.0.5
  - name: duckduckgo-search
    type: python
    package: duckduckgo-mcp-server
    version: 0.6.1
  - name: gitlab
    type: node
    package: "@zereight/mcp-gitlab"
    version: 2.1.52
  - name: grafana
    type: docker
    package: "mcp/grafana"
    version: latest
  - name: mongodb-database
    type: node
    package: mongodb-mcp-server
    version: 2.1.0
  - name: mysql-mcp-server
    type: python
    package: mysql-mcp-server
    version: 0.4.4
  - name: postgresql
    type: python
    package: postgres-mcp
    version: 0.3.0
    constraints:
      - "mcp<2"
  - name: redis
    type: python
    package: redis-mcp-server
    version: 0.5.1
  - name: terraform
    type: docker
    package: hashicorp/terraform-mcp-server
    version: 1.2.0
